[project]
name = "roughcut"
version = "2.1.0"
description = "Automatic video rough cut generator with Premiere XML export"
requires-python = ">=3.11"
dependencies = [
    "ffmpeg-python>=0.2.0",
    "opencv-python-headless>=4.8.0",
    "librosa>=0.10.0",
    "pandas>=2.0.0",
    "typer>=0.9.0",
    "pyyaml>=6.0",
    "numpy>=1.24.0",
]

[project.scripts]
roughcut = "roughcut.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/roughcut"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
tmp_path_retention_policy = "none"
