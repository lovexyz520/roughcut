project_type: growth
target_duration_sec: 240
video_photo_ratio: [6, 4]
clip_duration_sec:
  min: 2.5
  max: 7.0
max_same_event_streak_sec: 24
music:
  mode: single
  file: "music/love_me_back.mp3"
rhythm:
  snap_to_beat: true
  tolerance_ms: 130
diversity:
  max_consecutive_same_source: 1
  max_consecutive_same_event: 4
  max_consecutive_same_role: 2
  min_event_coverage: 0.35
  same_source_penalty: 0.20
  same_angle_penalty: 0.12
  chapter_repeat_penalty: 0.25
output:
  resolution: 1920x1080
  fps: 30
  draft_bitrate_mbps: 12
