project_type: growth
target_duration_sec: 240
video_photo_ratio: [7, 3]
clip_duration_sec:
  min: 1.5
  max: 6.0
max_same_event_streak_sec: 20
narrative_mode: chronological  # chronological | energy_first | hybrid
shot_detect:
  min_duration: 0.5
  max_duration: 8.0
  histogram_threshold: 0.4
  optical_flow_threshold: 12.0
  luminance_threshold: 30.0
  sample_interval: 3
music:
  mode: single
  file: ""  # Leave empty to auto-select from input folder
rhythm:
  snap_to_beat: true
  tolerance_ms: 120
diversity:
  max_consecutive_same_source: 2
  max_consecutive_same_event: 3
  max_consecutive_same_role: 2
  min_event_coverage: 0.3
  same_source_penalty: 0.15
  same_angle_penalty: 0.10
  chapter_repeat_penalty: 0.20
signals:                    # V2.2 semantic signals (all default on)
  expression: true          # real smile/expression detection
  source_audio: true        # laughter/excitement from each clip's own audio
  composition: true         # rule-of-thirds / headroom scoring
  camera_motion: true       # pan/tilt/zoom/shake classification
  color_continuity: true    # smooth jarring warm/cool jumps
  dedup: true               # suppress near-duplicate bursts
  smile_weight: 0.18        # growth: smiles are the story — weight them high
  composition_weight: 0.10
  audio_weight: 0.14
  color_jump_penalty: 0.08
  dedup_threshold: 6
output:
  resolution: 1920x1080
  fps: 30
  draft_bitrate_mbps: 12
